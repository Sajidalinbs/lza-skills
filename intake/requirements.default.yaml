# =============================================================================
#  LZA OPINIONATED DEFAULT — the network we PROPOSE to a customer.
#  Engineer edits only TWO things, then runs the planner:
#    1) every  *@example.com  email  (real, globally-unique inboxes)
#    2) the  external_cidrs  list     (the customer's on-prem / VPN / DX ranges)
#  Then:  python3 plan_subnets.py requirements.default.yaml
#  If the planner reports NO overlap, the customer approves the review Excel and
#  you proceed. If the customer's on-prem uses 10.x and it overlaps, shift the
#  whole plan: replace base "10.240"/"10.242".. with "172.16"/"172.17".. and re-run.
# =============================================================================

customer: customer
azs: [a, b, c]

# High 10-block on purpose: most on-prem sits in the low 10.0–10.x ranges, so a
# 10.240/13 base minimizes the chance of an overlap you'd have to redesign around.
supernet: 10.240.0.0/13            # 10.240.0.0 – 10.247.255.255

# ---- On-prem / peer ranges to AVOID — REPLACE with the customer's real list ---
external_cidrs:
  - { cidr: 172.16.0.0/16,  source: vpn,      description: REPLACE — example only }
  - { cidr: 192.168.0.0/16, source: on-prem,  description: REPLACE — example only }

# ---- Accounts (AWS Universal Config baseline names) -------------------------
accounts:
  - { name: Management,     alias: management,     ou: Root,           email: aws-managers+management@example.com, type: Mandatory, description: Org management }
  - { name: LogArchive,     alias: logarchive,     ou: Security,       email: aws-managers+log@example.com,        type: Mandatory, description: Central log archive }
  - { name: Audit,          alias: audit,          ou: Security,       email: aws-managers+audit@example.com,      type: Mandatory, description: Security delegated admin }
  - { name: Network,        alias: network,        ou: Infrastructure, email: aws-managers+network@example.com,    type: Workload,  description: TGW / inspection (no DNS or central-endpoints VPC) }
  - { name: SharedServices, alias: sharedservices, ou: Infrastructure, email: aws-managers+shared@example.com,     type: Workload,  description: Shared services }
  - { name: Perimeter,      alias: perimeter,      ou: Infrastructure, email: aws-managers+perimeter@example.com,  type: Workload,  description: Ingress/egress, NAT, public ALB/WAF }
  - { name: customer-prd,   alias: customer-prd,   ou: Workloads/Prod, email: aws-managers+prd@example.com,        type: Workload,  description: Production spoke }
  - { name: customer-dev,   alias: customer-dev,   ou: Workloads/Dev,  email: aws-managers+dev@example.com,        type: Workload,  description: Development spoke }
  - { name: customer-tst,   alias: customer-tst,   ou: Workloads/Test, email: aws-managers+tst@example.com,        type: Workload,  description: Test spoke }

# ---- OU structure (matches the AWS Universal Config baseline) ---------------
ous:
  - { path: Root,              parent: "-",        purpose: AWS Organization root }
  - { path: Security,          parent: Root,       purpose: Audit + LogArchive }
  - { path: Infrastructure,    parent: Root,       purpose: Network / SharedServices / Perimeter }
  - { path: Suspended,         parent: Root,       purpose: Decommissioned, ignore: true }
  - { path: Workloads,         parent: Root,       purpose: Application workload parent }
  - { path: Workloads/Sandbox, parent: Workloads,  purpose: Sandbox accounts }
  - { path: Workloads/Dev,     parent: Workloads,  purpose: Development accounts }
  - { path: Workloads/Test,    parent: Workloads,  purpose: Test accounts }
  - { path: Workloads/Prod,    parent: Workloads,  purpose: Production accounts }

# ---- VPCs: hub (Network/Perimeter) + Prod/Dev/Test spokes -------------------
# No IPAM, no DNS VPC, no central endpoints VPC. Spokes carry their own small
# `endpoints` tier for private AWS API access.
vpcs:

  # ---- Hub VPCs ----
  - name: vpc-ingress
    account: Perimeter
    region: '{{ HomeRegion }}'
    cidr: 10.240.0.0/22
    vpc_type: Hub - Ingress
    tgw: tgw-main
    tiers:
      - { name: protected, ips: 60, route_table: rt-ingress-protected, type: Public,   purpose: Public ALB }
      - { name: firewall,  ips: 8,  route_table: rt-ingress-firewall,  type: Firewall, purpose: NFW endpoints (reserved) }
      - { name: tgw,       ips: 8,  route_table: rt-ingress-tgw,       type: Transit,  purpose: TGW attachment ENIs }

  - name: vpc-egress
    account: Perimeter
    region: '{{ HomeRegion }}'
    cidr: 10.240.4.0/24
    vpc_type: Hub - Egress
    tgw: tgw-main
    tiers:
      - { name: public,   ips: 8, route_table: rt-egress-public,   type: Public,   purpose: NAT Gateways }
      - { name: firewall, ips: 8, route_table: rt-egress-firewall, type: Firewall, purpose: NFW endpoints (reserved) }
      - { name: tgw,      ips: 8, route_table: rt-egress-tgw,      type: Transit,  purpose: TGW attachment ENIs }

  - name: vpc-inspection
    account: Network
    region: '{{ HomeRegion }}'
    cidr: 10.240.5.0/24
    vpc_type: Hub - Inspection
    tgw: tgw-main
    tiers:
      - { name: firewall, ips: 8, route_table: rt-inspection-firewall, type: Firewall, purpose: AWS Network Firewall endpoints }
      - { name: tgw,      ips: 8, route_table: rt-inspection-tgw,      type: Transit,  purpose: TGW attachment (pre-inspection) }

  - name: vpc-sharedservices
    account: SharedServices
    region: '{{ HomeRegion }}'
    cidr: 10.240.7.0/24
    vpc_type: Hub - Shared Services
    tgw: tgw-main
    tiers:
      - { name: private,   ips: 25, route_table: rt-shared-private,   type: Private,  purpose: shared tooling }
      - { name: endpoints, ips: 25, route_table: rt-shared-endpoints, type: Private,  purpose: interface endpoints (shared) }
      - { name: tgw,       ips: 8,  route_table: rt-shared-tgw,       type: Transit,  purpose: TGW attachment ENIs }

  # ---- Workload spokes (standard 15-subnet pattern, /16 each) ----
  - name: vpc-prod
    account: customer-prd
    region: '{{ HomeRegion }}'
    cidr: 10.242.0.0/16
    vpc_type: Spoke - Production
    tgw: tgw-main
    tiers:
      - { name: loadbalancer, ips: 1000, route_table: rt-prod-lb,        type: Private, purpose: ALB/NLB ENIs }
      - { name: private,      ips: 8000, route_table: rt-prod-private,   type: Private, purpose: app/compute ENIs }
      - { name: database,     ips: 1000, route_table: rt-prod-database,  type: Private, purpose: Aurora/RDS }
      - { name: endpoints,    ips: 60,   route_table: rt-prod-endpoints, type: Private, purpose: per-VPC interface endpoints }
      - { name: tgw,          ips: 8,    route_table: rt-prod-tgw,       type: Transit, purpose: TGW attachment ENIs }

  - name: vpc-dev
    account: customer-dev
    region: '{{ HomeRegion }}'
    cidr: 10.243.0.0/16
    vpc_type: Spoke - Development
    tgw: tgw-main
    tiers:
      - { name: loadbalancer, ips: 1000, route_table: rt-dev-lb,        type: Private, purpose: ALB/NLB ENIs }
      - { name: private,      ips: 8000, route_table: rt-dev-private,   type: Private, purpose: app/compute ENIs }
      - { name: database,     ips: 1000, route_table: rt-dev-database,  type: Private, purpose: Aurora/RDS }
      - { name: endpoints,    ips: 60,   route_table: rt-dev-endpoints, type: Private, purpose: per-VPC interface endpoints }
      - { name: tgw,          ips: 8,    route_table: rt-dev-tgw,       type: Transit, purpose: TGW attachment ENIs }

  - name: vpc-test
    account: customer-tst
    region: '{{ HomeRegion }}'
    cidr: 10.244.0.0/16
    vpc_type: Spoke - Test
    tgw: tgw-main
    tiers:
      - { name: loadbalancer, ips: 1000, route_table: rt-test-lb,        type: Private, purpose: ALB/NLB ENIs }
      - { name: private,      ips: 8000, route_table: rt-test-private,   type: Private, purpose: app/compute ENIs }
      - { name: database,     ips: 1000, route_table: rt-test-database,  type: Private, purpose: Aurora/RDS }
      - { name: endpoints,    ips: 60,   route_table: rt-test-endpoints, type: Private, purpose: per-VPC interface endpoints }
      - { name: tgw,          ips: 8,    route_table: rt-test-tgw,       type: Transit, purpose: TGW attachment ENIs }
